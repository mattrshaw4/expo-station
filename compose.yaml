name: expo-station

# Shared settings for both kitchen services. The DB password comes from a secret file, never an env var.
x-kitchen-env: &kitchen-env
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-kitchen}
  POSTGRES_USER: ${POSTGRES_USER:-chef}
  POSTGRES_PASSWORD_FILE: /run/secrets/db_password
  REDIS_URL: redis://rail:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-kitchen-watch: &kitchen-watch
  watch:
    - action: sync+restart
      path: ./kitchen/app
      target: /srv/app
    - action: rebuild
      path: ./kitchen/requirements.txt

services:
  # ---------- The pantry: Postgres keeps every ticket ----------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-chef}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- The ticket rail: Redis list the line pulls from ----------
  rail:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Front of house: takes orders ----------
  order-api:
    build: ./kitchen
    environment: *kitchen-env
    secrets: [db_password]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; nothing else on your network can reach it
    depends_on:
      db:
        condition: service_healthy
      rail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop: *kitchen-watch

  # ---------- The line: cooks tickets ----------
  line-worker:
    build: ./kitchen
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *kitchen-env
      FAIL_RATE: ${FAIL_RATE:-0.02}
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
      rail:
        condition: service_healthy
    healthcheck:
      # Unhealthy if the main loop hasn't touched its heartbeat in 30s (stuck or hung worker).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/heartbeat') < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop: *kitchen-watch

  # =====================================================================
  # Phase 2: the expo station (metrics)
  # =====================================================================

  # ---------- Prometheus: scrapes and stores every metric ----------
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # lets you reload config with: curl -X POST localhost:9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      order-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------- docker-stats: CPU / memory / network for every container ----------
  # Replaces cAdvisor. cAdvisor needs the containerd socket, which Docker Desktop doesn't
  # expose to containers. This reads the Docker API instead (same data as `docker stats`)
  # and keeps cAdvisor's metric names, so the dashboard queries didn't change.
  docker-stats:
    build: ./exporters/docker-stats
    environment:
      COMPOSE_PROJECT: expo-station     # only report this project's containers
    volumes:
      # SECURITY: docker.sock = root on the Docker host, even mounted :ro (ro blocks file
      # writes, not API calls). Fine for a local lab; in shared environments put a
      # read-only socket proxy in front of it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'docker_stats_exporter_up 1.0' in urllib.request.urlopen('http://localhost:9417/metrics', timeout=5).read() else 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------- Grafana: the dashboard on the pass ----------
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"   # don't download extra app plugins at every boot
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/expo-station.json
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================================================
  # Phase 3: the ticket book (logs)
  # =====================================================================

  # ---------- Loki: stores and indexes every log line ----------
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    # No healthcheck: the Loki image is distroless (no shell, no wget, no curl), so there is
    # nothing inside it to run a probe with. Prometheus scrapes it instead, and up{job="loki"}
    # is the health signal. See README "Lessons".
    restart: unless-stopped

  # ---------- Alloy: tails container logs and ships them to Loki ----------
  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data   # remembers read positions across restarts
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # SECURITY: same caveat as docker-stats. docker.sock is root-equivalent, even :ro.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI: live pipeline graph at http://localhost:12345
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      # No curl or wget in the image, but bash can open TCP sockets itself via /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =====================================================================
  # Phase 4: calling it out (alerts)
  # =====================================================================

  # ---------- Alertmanager: groups, silences and routes alerts from Prometheus ----------
  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager     # keeps silences across restarts
    ports:
      - "127.0.0.1:9093:9093"               # Alertmanager UI: firing alerts, silences
    depends_on:
      printer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------- printer: the ticket printer at the pass (Alertmanager webhook receiver) ----------
  # Prints every alert and "all clear" as a JSON log line, so alerts land in Loki too.
  # Swap it for Discord, Slack or email in alertmanager.yml when you want real notifications.
  printer:
    build: ./alertmanager/printer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9095/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
