name: expo-station

# Shared settings for both kitchen services. The DB password comes from a secret file, never an env var.
x-kitchen-env: &kitchen-env
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-kitchen}
  POSTGRES_USER: ${POSTGRES_USER:-chef}
  POSTGRES_PASSWORD_FILE: /run/secrets/db_password
  REDIS_URL: redis://rail:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-kitchen-watch: &kitchen-watch
  watch:
    - action: sync+restart
      path: ./kitchen/app
      target: /srv/app
    - action: rebuild
      path: ./kitchen/requirements.txt

services:
  # ---------- The pantry: Postgres keeps every ticket ----------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-chef}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- The ticket rail: Redis list the line pulls from ----------
  rail:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Front of house: takes orders ----------
  order-api:
    build: ./kitchen
    environment: *kitchen-env
    secrets: [db_password]
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; nothing else on your network can reach it
    depends_on:
      db:
        condition: service_healthy
      rail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop: *kitchen-watch

  # ---------- The line: cooks tickets ----------
  line-worker:
    build: ./kitchen
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *kitchen-env
      FAIL_RATE: ${FAIL_RATE:-0.02}
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
      rail:
        condition: service_healthy
    healthcheck:
      # Unhealthy if the main loop hasn't touched its heartbeat in 30s (stuck or hung worker).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/heartbeat') < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop: *kitchen-watch

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
